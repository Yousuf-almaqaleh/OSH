<!DOCTYPE html>
<html lang="en">
<head>

<style>

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.w{grid-column:1/-1}
label.l{display:block;font-weight:500;font-size:13px;margin-bottom:3px}
.hint{color:var(--mute);font-weight:400}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}

.arch{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:6px 0}
.t{padding:8px 0;font-size:12px;text-align:center;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink);cursor:pointer;min-width:0}
.t.on{background:var(--acc);color:var(--card);border-color:var(--acc);font-weight:600}
.arch.lo{margin-top:10px}
.med{display:grid;gap:6px;margin-bottom:6px}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.tot{font-size:22px;font-family:"Source Serif 4",Georgia,serif;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 40px}
button.b{font:inherit;font-weight:600;padding:10px 18px;border-radius:4px;border:1px solid var(--acc);background:var(--acc);color:var(--card);cursor:pointer}
button.b.o{background:transparent;color:var(--acc)}
#msg{align-self:center;color:var(--acc);font-weight:500}
.tw{overflow-x:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.top button{padding:6px 12px;font-size:13px;white-space:nowrap}
.prow{display:flex;flex-wrap:wrap;gap:0 14px;margin-bottom:6px}.pq{display:flex;flex:1 1 280px;gap:2px}

.qUR .tb{border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}.qUL .tb{border-left:3px solid var(--ink);border-bottom:3px solid var(--ink)}.qLR .tb{border-right:3px solid var(--ink);border-top:3px solid var(--ink)}.qLL .tb{border-left:3px solid var(--ink);border-top:3px solid var(--ink)}
.tb.on{background:var(--acc);color:var(--card)}.tb.has{background:var(--warnbg);color:var(--warn)}.tb.miss{text-decoration:line-through}.tb.act{outline:2px solid var(--acc);outline-offset:1px}
.tp{border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:8px;background:var(--bg)}.tp .opts{margin:8px 0}.pt{margin-bottom:6px}.pt button{padding:4px 10px;font-size:13px}.dept{font-weight:600;color:var(--acc);font-size:15px;margin-bottom:2px}footer{text-align:center;color:var(--mute);font-size:13px;padding:8px 0 24px}.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:8px}.xi{margin:0}.xi img{width:100%;border:1px solid var(--line);border-radius:4px;background:#000}.xi input{margin-top:4px}.xi button{margin-top:4px;padding:4px 10px;font-size:13px}button.b.add{padding:6px 12px;font-size:13px;margin-top:2px}.med .mrm{padding:4px 10px}
@media(max-width:640px){.med{grid-template-columns:1fr 1fr!important}.med input:first-child{grid-column:1/-1}.arch{grid-template-columns:repeat(8,1fr)}.t{padding:10px 0}}
@media print{body{background:#fff;color:#000;font-size:11px}.bar,.chips,#tracker,.noprint{display:none!important}section{break-inside:avoid;border-color:#999}.wrap{padding:0}.hide{display:none}}
</style>
</head>

function caseOpts(){var n=REQ[($('#level').value||'')[0]]||0,s=$('#caseno'),k=s.value,h='<option value="">Select</option>';for(var i=1;i<=n;i++)h+='<option value="'+i+'">'+i+(i===n?' (exam)':'')+'</option>';s.innerHTML=h;s.value=k<=n?k:''}
function key(){var l=$('#level').value,t=$('#term').value,s=$('#student').value.trim().toLowerCase();return l&&t&&s?l+'|'+t+'|'+s:''}
function upd(){
 deps();var n=REQ[($('#level').value||'')[0]];if(n)if($('#caseno').options.length!==n+1)caseOpts();
 var c=+$('#caseno').value,b=$('#banner');
 if(n&&c){var ex=c===n;b.className='banner'+(ex?' exam':'');b.textContent=(ex?'Exam case. ':'')+'Case '+c+' of '+n+(ex?'. The supervisor grading below counts as the exam mark.':'. Case '+n+' is the exam.')}
 else if(n){b.className='banner';b.textContent='Each term requires '+n+' cases; case '+n+' is the exam.'}
 else{b.className='banner';b.textContent='Choose level, term and case number.'}
 $('#tc').textContent=teeth().length;$('#tl').textContent=teeth().join(', ');
 var t=0;['s_la','s_ex','s_at'].forEach(function(i){var e=$('#'+i),v=parseFloat(e.value);if(v>5){e.value=5;v=5}if(v<0){e.value=0;v=0}t+=isNaN(v)?0:v});$('#s_tot').textContent=t;
 chips()}
function chips(){var k=key(),n=REQ[($('#level').value||'')[0]],h='';if(!k||!n){$('#chips').innerHTML='<span class="hint">Enter student name, level and term to track required cases.</span>';return}
 var all=store().filter(function(x){return x.k===k}),done={};all.forEach(function(x){done[x.caseno]=x});
 var cnt=Object.keys(done).length;h='<span style="width:100%"><b>'+cnt+' of '+n+' cases saved</b> for this term</span>';
 for(var i=1;i<=n;i++)h+='<button type="button" class="chip'+(done[i]?' done':'')+(i===n?' ex':'')+(+$('#caseno').value===i?' cur':'')+'" data-c="'+i+'">'+(i===n?'Exam':i)+(done[i]?' ✓':'')+'</button>';
 $('#chips').innerHTML=h}
function msg(t){var m=$('#msg');m.textContent=t;setTimeout(function(){m.textContent=''},3500)}
$('#form').addEventListener('input',upd);$('#form').addEventListener('change',function(e){if(e.target.id==='level'){caseOpts()}upd()});
$('#form').addEventListener('click',function(e){var t=e.target.closest('.t');if(t){t.classList.toggle('on');upd()}});
$('#chips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;var k=key(),i=c.dataset.c,f=store().filter(function(x){return x.k===k&&x.caseno==i})[0];if(f){fill(f.d);msg('Loaded case '+i)}else{$('#caseno').value=i;upd()}});
$('#save').onclick=function(){var s=$('#student').value.trim();if(!s||!$('#level').value||!$('#term').value||!$('#caseno').value||!$('#pname').value.trim()){msg('Enter student name, level, term, case number and patient name first.');return}
 var a=store().filter(function(x){return !(x.k===key()&&x.caseno===$('#caseno').value)});a.push({k:key(),caseno:$('#caseno').value,d:collect(),at:new Date().toISOString()});var ok=put(a),m='Case saved on this device.';if(!ok){a[a.length-1].d.imgs=[];ok=put(a);m=ok?'Saved without X-ray images (storage full). Print or save as PDF to keep them.':'Could not save. Use Print / save as PDF to keep a copy.'}msg(m);upd()};
$('#print').onclick=function(){window.print()};
$('#clear').onclick=function(){var keep={student:$('#student').value,group:$('#group').value,level:$('#level').value,term:$('#term').value,supervisor:$('#supervisor').value,date:$('#date').value};fill({});Object.keys(keep).forEach(function(k){if(k==='level')caseOpts();setv(k,keep[k])});upd();window.scrollTo(0,0)};

var ROW={an:['Drug and dose','Route','Frequency','Duration','Quantity'],ab:['Drug and dose','Route','Frequency','Duration','Quantity'],ot:['Drug and dose','Route','Frequency','Duration','Quantity'],cm:['Drug and dose','Frequency','Reason / since when']};
var imgs=[],LS={an:'dl_an',ab:'dl_ab',ot:'dl_ot'};
function medBlock(k,l){return '<div class="f w"><label class="l">'+l+' <span class="hint">leave empty if none</span></label><div id="rows_'+k+'"></div><button type="button" class="b o add noprint" data-k="'+k+'">+ Add medication</button></div>'}
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function rowHTML(k,v){v=v||[];var p=ROW[k],L=k==='cm'?[]:[LS[k],'dl_r','dl_f','dl_u'];return '<div class="med" style="grid-template-columns:2fr repeat('+(p.length-1)+',1fr) auto">'+p.map(function(x,i){return '<input type="text" '+(L[i]?'list="'+L[i]+'" ':'')+'placeholder="'+x+'" value="'+esc(v[i])+'">'}).join('')+'<button type="button" class="b o mrm noprint" aria-label="Remove medication">×</button></div>'}
function getRows(){var r={};Object.keys(ROW).forEach(function(k){r[k]=$$('#rows_'+k+' .med').map(function(m){return N(m.querySelectorAll('input')).map(function(i){return i.value})}).filter(function(a){return a.some(Boolean)})});return r}
function setRows(r){r=r||{};Object.keys(ROW).forEach(function(k){var a=r[k]&&r[k].length?r[k]:[[]];$('#rows_'+k).innerHTML=a.map(function(v){return rowHTML(k,v)}).join('')})}
function rImgs(){$('#xg').innerHTML=imgs.map(function(m,i){return '<figure class="xi"><img src="'+m.src+'" alt="X-ray '+(i+1)+'"><input type="text" class="xc" data-i="'+i+'" placeholder="Caption, e.g. IOPA tooth 36" value="'+esc(m.cap)+'"><button type="button" class="b o rm noprint" data-i="'+i+'">Remove</button></figure>'}).join('')}
document.addEventListener('click',function(e){var a=e.target.closest('.add'),m=e.target.closest('.mrm'),r=e.target.closest('.rm');
 if(a)$('#rows_'+a.dataset.k).insertAdjacentHTML('beforeend',rowHTML(a.dataset.k));
 if(m)m.closest('.med').remove();
 if(r){imgs.splice(+r.dataset.i,1);rImgs()}});
document.addEventListener('input',function(e){if(e.target.classList.contains('xc'))imgs[+e.target.dataset.i].cap=e.target.value});
document.addEventListener('change',function(e){if(!e.target.classList.contains('xf'))return;N(e.target.files).forEach(function(f){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);imgs.push({src:c.toDataURL('image/jpeg',0.7),cap:''});rImgs()};im.src=fr.result};fr.readAsDataURL(f)});e.target.value=''});

var Q=['UR','UL','LR','LL'],PERM=['1','2','3','4','5','6','7','8'],PRIM=['A','B','C','D','E'],ORD=[],QN={UR:'upper right',UL:'upper left',LR:'lower right',LL:'lower left'};
Q.forEach(function(q){PERM.concat(PRIM).forEach(function(n){ORD.push(q+n)})});
var CH={ext:{p:0,sel:[]},dx:{p:0,act:'',tc:{}}};
var CONDS=['Missing','Caries','Deep caries (pulp involved)','Restored (filling)','Crown / bridge','Root canal treated','Retained root','Fractured','Mobile','Periapical lesion','Impacted','Partially erupted','Attrition / wear','Supernumerary','Other'];
function tn(k){return k.slice(0,2)+k.slice(2)+' ('+QN[k.slice(0,2)]+' '+k.slice(2)+')'}
function chartHTML(id){var c=CH[id],h='<div class="pc"><div class="pt noprint"><button type="button" class="b o pm" data-ch="'+id+'">'+(c.p?'Show permanent teeth (1–8)':'Show primary teeth (A–E)')+'</button></div>';
 ['U','L'].forEach(function(u){h+='<div class="prow">';['R','L'].forEach(function(sd){var q=u+sd,a=(c.p?PRIM:PERM).slice();if(sd==='R')a.reverse();h+='<div class="pq q'+q+'">'+a.map(function(n){var k=q+n,t=CH.dx.tc[k],cl='tb';
  if(id==='ext'){if(CH.ext.sel.indexOf(k)>-1)cl+=' on'}else{if(t&&(t.c.length||t.n))cl+=' has';if(t&&t.c.indexOf('Missing')>-1)cl+=' miss';if(CH.dx.act===k)cl+=' act'}
  return '<button type="button" class="'+cl+'" data-ch="'+id+'" data-k="'+k+'" title="'+tn(k)+'">'+n+'</button>'}).join('')+'</div>'});h+='</div>'});return h+'</div>'}
function rChart(id){$('#ch_'+id).innerHTML=chartHTML(id)}
function rPanel(){var k=CH.dx.act,t=CH.dx.tc[k]||{c:[],n:''};$('#dxp').innerHTML=k?'<div class="tp"><div><b>'+tn(k)+'</b> <button type="button" class="b o tcc" data-k="'+k+'" style="padding:2px 10px;font-size:13px">Clear tooth</button></div><div class="opts">'+CONDS.map(function(c){return '<label><input type="checkbox" class="tcb" value="'+c+'"'+(t.c.indexOf(c)>-1?' checked':'')+'> '+c+'</label>'}).join('')+'</div><input type="text" class="tcn" placeholder="Details, e.g. mesial caries, grade II mobility" value="'+esc(t.n)+'"></div>':''}
function sum(){var l=ORD.filter(function(k){var t=CH.dx.tc[k];return t&&(t.c.length||t.n)}).map(function(k){var t=CH.dx.tc[k];return '<div><b>'+k+'</b>: '+t.c.join(', ')+(t.n?(t.c.length?' – ':'')+esc(t.n):'')+'</div>'});$('#dxs').innerHTML=l.length?l.join(''):'<b>Teeth: NAD</b> <span class="hint noprint">(tap a tooth to record findings)</span>'}
function rCharts(){rChart('ext');rChart('dx');rPanel();sum();upd()}
function tcUpd(){var k=CH.dx.act,p=$('#dxp'),c=N(p.querySelectorAll('.tcb:checked')).map(function(x){return x.value}),n=p.querySelector('.tcn').value;if(c.length||n)CH.dx.tc[k]={c:c,n:n};else delete CH.dx.tc[k];rChart('dx');sum()}
document.addEventListener('click',function(e){var t=e.target.closest('.tb'),p=e.target.closest('.pm'),c=e.target.closest('.tcc');
 if(t){var id=t.dataset.ch,k=t.dataset.k;if(id==='ext'){var i=CH.ext.sel.indexOf(k);if(i>-1)CH.ext.sel.splice(i,1);else CH.ext.sel.push(k);rChart('ext');upd()}else{CH.dx.act=CH.dx.act===k?'':k;rChart('dx');rPanel()}}
 if(p){var d=p.dataset.ch;CH[d].p=CH[d].p?0:1;if(d==='dx'){CH.dx.act='';rPanel()}rChart(d)}
 if(c){delete CH.dx.tc[c.dataset.k];rChart('dx');rPanel();sum()}});
document.addEventListener('change',function(e){if(e.target.classList.contains('tcb'))tcUpd()});
document.addEventListener('input',function(e){if(e.target.classList.contains('tcn'))tcUpd()});
function isDark(){var t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('osc_theme',t)}catch(e){}$('#theme').textContent=t==='dark'?'Light mode':'Dark mode'}
$('#theme').onclick=function(){setTheme(isDark()?'light':'dark')};
var TH=null;try{TH=localStorage.getItem('osc_theme')}catch(e){}
if(TH)setTheme(TH);else $('#theme').textContent=isDark()?'Light mode':'Dark mode';
var PT;window.addEventListener('beforeprint',function(){PT=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light'});
window.addEventListener('afterprint',function(){if(PT)document.documentElement.dataset.theme=PT;else delete document.documentElement.dataset.theme});
setRows({});rImgs();rCharts();
$('#date').value=new Date().toISOString().slice(0,10);caseOpts();upd();
